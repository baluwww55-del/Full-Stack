<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex-box-masterclass</title>
</head>
<body>
    <div>
        
        <h1>Flex box masterclass Demo</h1>
        <div class="flex-container">
            <h2>Default-flex (row)</h2>
            <div class="square-pastel-1">1</div>
            <div class="square-pastel-2">2</div>
            <div class="square-pastel-3">3</div>
            <div class="square-pastel-4">4</div>
            <div class="square-pastel-5">5</div>
        </div>
    </div>

    <div>
        <h2>Flex direction:column</h2>
        <div class="flex-container" style="flex-direction: column;">
            <div class="square-pastel-1">1</div>
            <div class="square-pastel-2">2</div>
            <div class="square-pastel-3">3</div>
            <div class="square-pastel-4">4</div>
            <div class="square-pastel-5">5</div>
        </div>
    </div>

    <div>
        <h2>justify-content: space-between</h2>
        <div class="flex-container" style="justify-content: space-between;">
            <div class="square-pastel-1">1</div>
            <div class="square-pastel-2">2</div>
            <div class="square-pastel-3">3</div>
            <div class="square-pastel-4">4</div>
            <div class="square-pastel-5">5</div>
        </div>
    </div>

    <div>
        <h2>align-items: center</h2>
        <div class="flex-container" style="align-items: center;">
            <div class="square-pastel-1">1</div>
            <div class="square-pastel-2">2</div>
            <div class="square-pastel-3">3</div>
            <div class="square-pastel-4">4</div>
            <div class="square-pastel-5">5</div>
        </div>
    </div>

    <div>
        <h2>flex-wrap: wrap</h2>
        <div class="flex-container" style="flex-wrap: wrap;">
            <div class="square-pastel-1">1</div>
            <div class="square-pastel-2">2</div>
            <div class="square-pastel-3">3</div>
            <div class="square-pastel-4">4</div>
            <div class="square-pastel-5">5</div>
            <div class="square-pastel-6">6</div>
            <div class="square-pastel-7">7</div>
            <div class="square-pastel-8">8</div>
            <div class="square-pastel-9">9</div>
            <div class="square-pastel-10">10</div>
        </div>
    </div>

    <div class="flex-container"
        <h2>align-content: space-around</h2>
        <div class="flex-container"
            <div class="square-pastel-1">1</div>
            <div class="square-pastel-2">2</div>
            <div class="square-pastel-3">3</div>
            <div class="square-pastel-4">4</div>
            <div class="square-pastel-5">5</div>
        </div>
    </div>

    <div class="flex-container" 
        <h2>8. order property</h2>
        <div class="flex-container">
            <div class="square-pastel-1" style="order: 5;">1</div>
            <div class="square-pastel-2" style="order: 4;">2</div>
            <div class="square-pastel-3" style="order: 3;">3</div>
            <div class="square-pastel-4" style="order: 2;">4</div>
            <div class="square-pastel-5" style="order: 1;">5</div>
        </div>
    </div>

    <div class="flex-container">
        <h2>8. flex-grow</h2>
        <div class="flex-container">
            <div class="square-pastel-1" style="flex-grow: 1;">1</div>
            <div class="square-pastel-2" style="flex-grow: 2;">2</div>
            <div class="square-pastel-3" style="flex-grow: 3;">3</div>
            <div class="square-pastel-4" style="flex-grow: 4;">4</div>
            <div class="square-pastel-5" style="flex-grow: 5;">5</div>
        </div>
    </div>
</body>
</html>
