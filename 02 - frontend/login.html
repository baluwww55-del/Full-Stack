<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <h2 class="txt-center text-3xl text-white mb-6-bold">Login</h2>
    <form>
      <div class="bg-gray-700 flex items-center min-h-screen800 rounded-lg p-8 shodow-lg max-w-sm w-full">
        <label class="block text-sm font medium text-gray 400 margin-bottom -300" for="username">Username:</label>
        <input class="w-full px-3 py-2 bg-gray-600
        border-gray-900 rounded-md text-white focus:whiteline-none focus-ring-2" type="text" id="username" name="username" placeholder="username" />
      </div>
      <div>
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" placeholder="password" />
        <button class="w-full text-white-4 py-2 rounded-md hover:bg-blue-700 shadow-lg-2xl" "submit">Login</button>
      </div>
    </form>
  </body>
</html>
