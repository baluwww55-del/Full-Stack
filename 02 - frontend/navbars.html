<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

<style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      margin: 0;
      padding: 20px;
      background-color: #1a1a1a;
    }
    .nav1::after {
        content: "";
        display: block;
        position: absolute;
        width: 100;
        height: 2px;
        bottom: 0;
        left: 0;
        transform: scaleX(0);
        transition: transform 0.3s ease-in-out;

    }
    .nav1:hover::after {
        transform: scaleX(1);
    }

    .navbar {
     margin-bottom: 40px;
    }
    h2 {
        margin-bottom: 20px;
    }
    .nav1{
        border: 2px solid #fffefe;
        background-color: #f1f1f1;
    }
    .nav1 ul{
        list-style-type: none;
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: space-around;
    }
    .nav1 li {
        display: flex;
        background-color: #fefefe;
    }
    .nav1 a {
        text-decoration: none;
        color: #0f0f0f;
        padding: 5px 15px;
        position: relative;
    }
    .nav1 .login-btn {
        color: #edebef;
        background-color: #5048e2;
        border: 2px solid #5048e2;
        padding: 5px 15px;
        cursor: pointer;
        border-radius: 5px;
        text-align: center;
        MARGIN: 0;
    }
    .login-btn:hover {
        background-color: #2c04ae;
        color: #f0f2fb;
    }
</style>
<body>
    <div class="navbar">
        <nav class="nav1">
        <div class="logo">Navbar: </div>
        <ul class="nav-links">

            <li><a href="#">Contact</a></li>

            </li>

        </nav>
        </div>
